<header class="mast">
  <div class="mast-row">
    <a class="brand" href="{{ '/' | relative_url }}">
      <svg class="crest" viewBox="0 0 36 36" aria-hidden="true">
        <circle cx="18" cy="18" r="16" fill="#1a1408" stroke="#e2c56a" stroke-width="1.5"/>
        <path d="M18 7l2.4 6.2H27l-5.2 3.8 2 6.2L18 19.6 12.2 23.2l2-6.2L9 13.2h6.6z" fill="#e2c56a"/>
      </svg>
      <span class="brand-text">
        <span class="brand-kicker">Wiki</span>
        <span class="brand-name">Forever</span>
      </span>
    </a>
    <nav class="tabs" aria-label="Sections">
      <a class="{% if page.layout == 'home' %}is-current{% endif %}" href="{{ '/' | relative_url }}">Guides</a>
      <a class="{% if page.layout == 'guide' %}is-current{% endif %}" href="{{ '/leveling/' | relative_url }}">Leveling</a>
    </nav>
    <form class="find" action="{{ '/leveling/' | relative_url }}" method="get" role="search">
      <label class="sr" for="q">Search the leveling guide</label>
      <input id="q" name="q" type="search" placeholder="Search headings" value="">
    </form>
  </div>
</header>
