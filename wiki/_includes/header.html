<header class="mast">
  <div class="mast-row">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img class="crest" src="{{ '/assets/crest.png' | relative_url }}" alt="" width="42" height="42">
      <span class="brand-text">
        <span class="brand-kicker">Wiki</span>
        <span class="brand-name">Forever</span>
      </span>
    </a>
    <nav class="tabs" aria-label="Sections">
      <a class="{% if page.layout == 'home' %}is-current{% endif %}" href="{{ '/' | relative_url }}">Guides</a>
      <a class="{% if page.url == '/leveling/' %}is-current{% endif %}" href="{{ '/leveling/' | relative_url }}">Leveling</a>
      <a class="{% if page.url contains '/healing/' %}is-current{% endif %}" href="{{ '/healing/' | relative_url }}">Healing</a>
      <a class="{% if page.url == '/specs/' or page.url == '/holy/' or page.url == '/disc/' %}is-current{% endif %}" href="{{ '/specs/' | relative_url }}">Talent specs</a>
    </nav>
    <form class="find" action="{% if page.layout == 'guide' %}{{ page.url | relative_url }}{% else %}{{ '/leveling/' | relative_url }}{% endif %}" method="get" role="search">
      <label class="sr" for="q">Search headings</label>
      <input id="q" name="q" type="search" placeholder="Search headings" value="">
    </form>
  </div>
</header>
