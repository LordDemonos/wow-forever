title: Forever
tagline: Priest notes for WoW Forever
description: Personal priest guides and talent specs for WoW Forever. Leveling follows an Undead priest on the Horde. Healing and the level 60 trees apply to Alliance and Horde.
url: https://lorddemonos.github.io
baseurl: /wow-forever
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
permalink: pretty
sass:
  style: compressed
exclude:
  - Gemfile
  - README.md
  - vendor
defaults:
  - scope:
      path: ""
    values:
      layout: default
