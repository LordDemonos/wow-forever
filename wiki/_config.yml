title: Forever
tagline: Healer notes for WoW Forever
description: Personal healer guides and talent specs for WoW Forever. Leveling follows a dungeon-focused path on the Horde. Priest, Holy Paladin, Restoration Druid, and Restoration Shaman healing, and the level 60 trees, apply to Alliance and Horde.
url: https://lorddemonos.github.io
baseurl: /wow-forever
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
permalink: pretty
