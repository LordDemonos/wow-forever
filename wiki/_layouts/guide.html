---
layout: default
---
<div class="guide-shell">
  <aside class="toc" id="toc" data-enhance="toc">
    <div class="toc-head">
      <p class="toc-kicker">{{ page.kicker }}</p>
      <h2>{{ page.title }}</h2>
    </div>
    <label class="toc-search">
      <span class="sr">Filter sections</span>
      <input id="toc-filter" type="search" placeholder="Filter sections" autocomplete="off">
    </label>
    <nav id="toc-nav" aria-label="On this page"></nav>
  </aside>
  <article id="content" class="article{% if page.wide %} is-wide{% endif %}"
    data-icon-horde="{{ '/assets/icons/horde.png' | relative_url }}"
    data-icon-alliance="{{ '/assets/icons/alliance.png' | relative_url }}"
    data-icon-quest-start="{{ '/assets/icons/quest-start.gif' | relative_url }}"
    data-icon-quest-end="{{ '/assets/icons/quest-end.gif' | relative_url }}">
    {{ content }}
  </article>
</div>
<script src="{{ '/assets/js/toc.js' | relative_url }}"></script>
<script src="{{ '/assets/js/faction.js' | relative_url }}?v=2"></script>
<script src="{{ '/assets/js/talents.js' | relative_url }}?v=4" data-frame="{{ '/assets/talent-frame.html' | relative_url }}"></script>
<script>
  const whTooltips = {colorLinks: true, iconizeLinks: true, renameLinks: false};
</script>
<script src="https://wow.zamimg.com/widgets/power.js"></script>
<script>
  document.querySelectorAll("a.shot").forEach(function (link) {
    link.style.setProperty("--shot", "url(\"" + link.href + "\")");
  });

  (function () {
    var mapBase = "https://wow.zamimg.com/images/wow/maps/enus/normal/";
    var ready = {};

    function attach(link) {
      var match = link.href.match(/zone=(\d+)/);
      if (!match) return;
      var id = match[1];
      var url = mapBase + id + ".jpg";
      link.setAttribute("data-disable-wowhead-tooltip", "true");
      if (!ready[id]) {
        ready[id] = new Promise(function (resolve) {
          var img = new Image();
          img.onload = function () { resolve(true); };
          img.onerror = function () { resolve(false); };
          img.src = url;
        });
      }
      ready[id].then(function (ok) {
        if (!ok) {
          link.removeAttribute("data-disable-wowhead-tooltip");
          return;
        }
        link.classList.add("zone-map");
        link.style.setProperty("--shot", "url(\"" + url + "\")");
      });
    }

    document.querySelectorAll("#content p").forEach(function (paragraph) {
      var strong = paragraph.querySelector("strong");
      if (!strong) return;
      var label = strong.textContent.replace(/\s+/g, " ").trim();
      if (label !== "Run." && label !== "Run") return;
      paragraph.querySelectorAll("a[href*='zone=']").forEach(attach);
      var list = paragraph.nextElementSibling;
      if (!list || list.tagName !== "OL") return;
      list.querySelectorAll("a[href*='zone=']").forEach(attach);
    });
  })();
</script>
